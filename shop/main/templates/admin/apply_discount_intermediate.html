{% extends "admin/base_site.html" %}
{% block content %}
<div style="max-width:720px;margin:24px auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:12px;">
  <h1 style="margin:0 0 7px;">Установить скидку</h1>
  <p style="margin:0 0 20px;color:#666;">Выбрано товаров: <strong>{{ queryset.count }}</strong></p>
  <form action="" method="post">{% csrf_token %}{{ form.as_p }}
    {% for obj in queryset %}<input type="hidden" name="_selected_action" value="{{ obj.pk }}">{% endfor %}
    <input type="hidden" name="action" value="{{ action_name }}">
    <div style="display:flex;gap:10px;margin-top:22px;"><input type="submit" name="apply" value="Применить скидку" class="button"><a href="." class="button deletelink">Отмена</a></div>
  </form>
</div>
{% endblock %}
