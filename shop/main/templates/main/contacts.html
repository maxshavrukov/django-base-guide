{% extends 'main/base.html' %}

{% block content %}
<div class="contacts_page">
  <h1 class="static_title">Контакты</h1>

  <div class="contacts_grid">
    <!-- Блок с контактами -->
    <div class="contact_info_block">
      <div class="contact_item">
        <h3>📍 Адрес</h3>
        <p>г. Запорожье, ул. Кичкавская, 12</p>
      </div>

      <div class="contact_item">
        <h3>📞 Телефоны</h3>
        <p>+38 (096) 123-45-67</p>
        <p>+38 (050) 765-43-21</p>
      </div>

      <div class="contact_item">
        <h3>✉️ Email</h3>
        <p>support@baseguide.com</p>
      </div>

      <div class="contact_item">
        <h3>⏰ Режим работы</h3>
        <p>Пн-Вс: 09:00 — 21:00</p>
      </div>
    </div>

    <!-- Форма "Написать нам" -->
    <div class="contact_form_wrapper">
      <h2 class="contact_form_title">Написать нам</h2>
      
      <form action="#" method="post" class="contact_form">
        {% csrf_token %}
        <div class="contact_field">
          <label for="name">Ваше имя</label>
          <input type="text" id="name" name="name" class="contact_input" placeholder="Иван" required>
        </div>

        <div class="contact_field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="contact_input" placeholder="example@mail.com" required>
        </div>

        <div class="contact_field">
          <label for="message">Сообщение</label>
          <textarea id="message" name="message" class="contact_textarea" placeholder="Ваш вопрос или предложение..." required></textarea>
        </div>

        <button type="submit" class="contact_submit_btn">Отправить</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
